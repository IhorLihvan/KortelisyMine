[package]
name = "updates"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
serde = { version = "1", features = ["derive"]}
serde_json = "1"
sha2 = "0.10"
reqwest ={ version = "0.11", features = ["blocking", "json"]}
colored = "2.1"
indicatif = "0.17"